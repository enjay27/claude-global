# The code-graph bundle: code-review-graph prebuilt for cloud sessions (Linux x86_64), so the
# code-graph skill's first cg call downloads about 36 MB instead of a pip install. Local sessions
# keep installing it with pip. scripts/code-graph-bundle.cjs does the work:
#   - the version is VERSION in agent-skills/code-graph/scripts/cg.cjs, and the packages are the
#     lock in scripts/code-graph-bundle/requirements.txt (what cg imports, with hashes),
#   - the build installs them into a portable Python with --no-deps --require-hashes and trims it,
#   - the checks refuse a license off the allowlist (and Berkeley DB, AGPL-3.0, in _dbm), and
#     refuse a bundle that answers any cg command differently from a full pip install,
#   - the release is code-graph-<VERSION>-<n>, never marked latest; the global rules' v* releases
#     stay the latest, and global-sync reads only those.
# A push to main that changes the version, the lock or the build runs it; it builds nothing when a
# release already holds this build (its notes carry the bundle key). By hand, `rebuild` makes the
# next number of the same build. Only the publish job can write, and it runs none of the
# repository's code.
name: code-graph bundle

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Release a new build number even when this build is already released
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - agent-skills/code-graph/scripts/cg.cjs
      - scripts/code-graph-bundle.cjs
      - scripts/code-graph-bundle/**
      - .github/workflows/code-graph-bundle.yml

permissions: {}

concurrency:
  group: code-graph-bundle
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Only main is built
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::the bundle is built from main only; this run is on $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the build script and the cg wrapper
        run: node --test scripts/code-graph-bundle.test.cjs scripts/code-graph.test.cjs
      - name: The lock pins VERSION
        run: node scripts/code-graph-bundle.cjs check-lock
      - name: Install the pinned uv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install -q "uv==$(node scripts/code-graph-bundle.cjs uv-version)"
          echo "$RUNNER_TEMP/uv/bin" >> "$GITHUB_PATH"
      - name: Pick the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          force=""
          if [ "$REBUILD" = true ]; then force=--force; fi
          tag=$(gh api --paginate "repos/$REPO/releases" --jq '.[] | {tag: .tag_name, body: (.body // "")} | tojson' \
                | node scripts/code-graph-bundle.cjs next-tag $force)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "This build is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Building $tag." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the bundle and a full install to compare it with
        if: steps.tag.outputs.tag != ''
        run: |
          node scripts/code-graph-bundle.cjs build "$RUNNER_TEMP/bundle"
          node scripts/code-graph-bundle.cjs full "$RUNNER_TEMP/full"
      - name: Licenses
        if: steps.tag.outputs.tag != ''
        run: node scripts/code-graph-bundle.cjs licenses "$RUNNER_TEMP/bundle"
      - name: The bundle answers like a full install
        if: steps.tag.outputs.tag != ''
        run: node scripts/code-graph-bundle.cjs verify "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/full"
      - name: Pack
        if: steps.tag.outputs.tag != ''
        run: |
          node scripts/code-graph-bundle.cjs pack "$RUNNER_TEMP/bundle" dist
          cat dist/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.tag.outputs.tag != ''
        with:
          name: code-graph-bundle
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # the tag and the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-graph-bundle
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$TAG" --repo "$REPO" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file dist/notes.md --latest=false \
            dist/crg-linux-x86_64.tar.gz dist/SHA256SUMS
          echo "Released $TAG at $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
