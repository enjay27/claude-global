# Adds this repository's issues to the kade-agent organization Project ("Kade Agent") and
# applies command labels (cmd:status-now, cmd:verify-not-verified, ...). The bridge is this
# organization's own: kade-agent/.github (public). Needs vars.PROJECT_NUMBER, vars.BRIDGE_APP_CLIENT_ID
# and secrets.BRIDGE_APP_PRIVATE_KEY as organization settings shared with this repository; the
# key is passed by name, so the call grants this one secret and no other.
# Dormant (the job is skipped) until PROJECT_NUMBER is set.
name: Project sync

on:
  issues:
    types: [opened, reopened, labeled]

permissions: {}

jobs:
  sync:
    if: vars.PROJECT_NUMBER != ''
    permissions:
      issues: write  # remove applied command labels; read the sender's permission
    uses: kade-agent/.github/.github/workflows/project-sync.yml@main
    secrets:
      BRIDGE_APP_PRIVATE_KEY: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
