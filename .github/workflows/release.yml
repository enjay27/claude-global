# The release (docs/global-rules-plan.md, section 6). Kade starts it by hand on rc, after merging a
# PR from main into rc. For the head commit of rc it
#   - picks the tag vYYYY.MM.DD from the UTC date (.2, .3 for a later release the same day) and
#     refuses a commit that is already released (scripts/release.cjs next),
#   - writes the tag into line 1 of CLAUDE.md and runs every test on that tree,
#   - creates one commit with that stamp whose parent is the rc commit, tags it and makes a GitHub
#     release with the commits since the previous release.
# rc and main are never written: the stamped commit is reachable only from its tag, and the next
# release starts again from rc. global-sync moves every session to the new tag at its next start.
# Only the tag job can write, and it runs none of the repository's code; it refuses unless the
# blob and tree it creates are the ones the check job tested. The tag ruleset must let GitHub
# Actions create v* tags (and nobody move or delete them).
name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: stamp and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.stamp.outputs.tag }}
      blob: ${{ steps.stamp.outputs.blob }}
      tree: ${{ steps.stamp.outputs.tree }}
      content: ${{ steps.stamp.outputs.content }}
      notes: ${{ steps.stamp.outputs.notes }}
    steps:
      - name: Only rc is released
        run: |
          if [ "$GITHUB_REF" != refs/heads/rc ]; then
            echo "::error::a release is made from rc only; this run is on $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stamp CLAUDE.md and test that tree
        id: stamp
        run: |
          set -euo pipefail
          tag=$(node scripts/release.cjs next)
          previous=$(node scripts/release.cjs latest)
          node scripts/release.cjs stamp "$tag"
          stamp=$(head -n 1 CLAUDE.md)
          if [ "$stamp" != "Global rules: $tag" ]; then
            echo "::error::line 1 of CLAUDE.md is '$stamp', not the tag $tag"
            exit 1
          fi
          node --test
          git add CLAUDE.md
          {
            echo "Global rules $tag, from rc at $GITHUB_SHA."
            echo
            if [ -n "$previous" ]; then
              echo "Since $previous:"
              echo
              git log --no-merges --format='- %h %s' "$previous..HEAD"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "tag=$tag"
            echo "blob=$(git rev-parse :CLAUDE.md)"
            echo "tree=$(git write-tree)"
            echo "content=$(base64 -w0 CLAUDE.md)"
            echo "notes=$(base64 -w0 "$RUNNER_TEMP/notes.md")"
          } >> "$GITHUB_OUTPUT"

  tag:
    name: tag and GitHub release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # the stamped commit, the tag and the release
    steps:
      - name: Create the stamped commit, the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          BLOB: ${{ needs.check.outputs.blob }}
          TREE: ${{ needs.check.outputs.tree }}
          CONTENT: ${{ needs.check.outputs.content }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail
          blob=$(gh api "repos/$REPO/git/blobs" -f encoding=base64 -f content="$CONTENT" --jq .sha)
          if [ "$blob" != "$BLOB" ]; then
            echo "::error::the CLAUDE.md blob $blob is not the tested $BLOB"
            exit 1
          fi
          base=$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" --jq .tree.sha)
          tree=$(jq -n --arg base "$base" --arg sha "$blob" \
                   '{base_tree: $base, tree: [{path: "CLAUDE.md", mode: "100644", type: "blob", sha: $sha}]}' \
                 | gh api "repos/$REPO/git/trees" --input - --jq .sha)
          if [ "$tree" != "$TREE" ]; then
            echo "::error::the tree $tree is not the tested $TREE"
            exit 1
          fi
          commit=$(jq -n --arg msg "Release $TAG" --arg tree "$tree" --arg parent "$GITHUB_SHA" \
                     '{message: $msg, tree: $tree, parents: [$parent]}' \
                   | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          object=$(jq -n --arg tag "$TAG" --arg sha "$commit" \
                     '{tag: $tag, message: ("Global rules " + $tag), object: $sha, type: "commit"}' \
                   | gh api "repos/$REPO/git/tags" --input - --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          base64 -d <<<"$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "Released $TAG at $commit (parent $GITHUB_SHA on rc)." >> "$GITHUB_STEP_SUMMARY"
